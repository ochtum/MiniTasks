# Dedicated local project. Scripts reject other IDs and ports.
project_id = "minitasks"

[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 54429

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5050"
additional_redirect_urls = ["http://localhost:5050"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Enables the email/password provider; [auth].enable_signup still forbids registration.
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54427
